<svg width="680" height="580" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>N+1 problem vs JOIN FETCH fix</title>
  <desc>Two side-by-side flows showing N+1 queries with EAGER only vs single JOIN query with JOIN FETCH</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .th  { font-size: 14px; font-weight: 600; fill: #3C3489; }
      .ts  { font-size: 12px; font-weight: 400; fill: #534AB7; }
      .th-t { font-size: 14px; font-weight: 600; fill: #085041; }
      .ts-t { font-size: 12px; font-weight: 400; fill: #0F6E56; }
      .th-g { font-size: 14px; font-weight: 600; fill: #444441; }
      .ts-g { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
      .th-c { font-size: 14px; font-weight: 600; fill: #712B13; }
      .ts-c { font-size: 12px; font-weight: 400; fill: #993C1D; }
      .legend { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
      .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <!-- ─── BACKGROUND ─── -->
  <rect width="680" height="580" fill="#ffffff"/>

  <!-- ══════════════════════════════════════════
       LEFT SIDE — N+1 problem
  ══════════════════════════════════════════ -->

  <!-- Column header (coral) -->
  <rect x="40" y="30" width="270" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="th-c" x="175" y="48" text-anchor="middle" dominant-baseline="central">❌  EAGER only — N+1 queries</text>
  <text class="ts-c" x="175" y="66" text-anchor="middle" dominant-baseline="central"/>

  <!-- Your code box (gray) -->
  <rect x="90" y="104" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th-g" x="175" y="120" text-anchor="middle" dominant-baseline="central">Your code</text>
  <text class="ts-g" x="175" y="138" text-anchor="middle" dominant-baseline="central">findAllOrders()</text>

  <!-- Arrow -->
  <line x1="175" y1="148" x2="175" y2="170" class="arr" marker-end="url(#arrow)"/>

  <!-- Query 1 (purple) -->
  <rect x="65" y="172" width="220" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th"  x="175" y="188" text-anchor="middle" dominant-baseline="central">Query 1</text>
  <text class="ts"  x="175" y="206" text-anchor="middle" dominant-baseline="central">SELECT * FROM orders</text>

  <!-- Arrow -->
  <line x1="175" y1="216" x2="175" y2="238" class="arr" marker-end="url(#arrow)"/>

  <!-- Returns N rows label -->
  <text class="ts-g" x="175" y="252" text-anchor="middle" dominant-baseline="central">returns 3 rows  (N = 3)</text>

  <!-- Arrow -->
  <line x1="175" y1="262" x2="175" y2="284" class="arr" marker-end="url(#arrow)"/>

  <!-- Fan lines to 3 sub-queries -->
  <line x1="175" y1="284" x2="80"  y2="294" class="arr" marker-end="url(#arrow)" stroke-width="1"/>
  <line x1="175" y1="284" x2="175" y2="294" class="arr" marker-end="url(#arrow)" stroke-width="1"/>
  <line x1="175" y1="284" x2="270" y2="294" class="arr" marker-end="url(#arrow)" stroke-width="1"/>

  <!-- Query 2 -->
  <rect x="42"  y="294" width="76" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="th-c" x="80"  y="313" text-anchor="middle" dominant-baseline="central">Query 2</text>
  <text class="ts-c" x="80"  y="331" text-anchor="middle" dominant-baseline="central">cust id=1</text>

  <!-- Query 3 -->
  <rect x="137" y="294" width="76" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="th-c" x="175" y="313" text-anchor="middle" dominant-baseline="central">Query 3</text>
  <text class="ts-c" x="175" y="331" text-anchor="middle" dominant-baseline="central">cust id=2</text>

  <!-- Query 4 -->
  <rect x="232" y="294" width="76" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="th-c" x="270" y="313" text-anchor="middle" dominant-baseline="central">Query 4</text>
  <text class="ts-c" x="270" y="331" text-anchor="middle" dominant-baseline="central">cust id=3</text>

  <!-- Converge lines to total box -->
  <line x1="80"  y1="346" x2="120" y2="370" class="arr" marker-end="url(#arrow)" stroke-width="1"/>
  <line x1="175" y1="346" x2="175" y2="370" class="arr" marker-end="url(#arrow)" stroke-width="1"/>
  <line x1="270" y1="346" x2="230" y2="370" class="arr" marker-end="url(#arrow)" stroke-width="1"/>

  <!-- Total box (coral) -->
  <rect x="65" y="370" width="220" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text class="th-c" x="175" y="386" text-anchor="middle" dominant-baseline="central">Total: 1 + N queries</text>
  <text class="ts-c" x="175" y="404" text-anchor="middle" dominant-baseline="central">3 orders → 4 DB round trips</text>

  <!-- Root cause dashed callout -->
  <rect x="40" y="436" width="270" height="54" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 3"/>
  <text class="ts-g" x="175" y="456" text-anchor="middle" dominant-baseline="central">EAGER controls timing —</text>
  <text class="ts-g" x="175" y="474" text-anchor="middle" dominant-baseline="central">not how many queries fire</text>


  <!-- ─── DIVIDER ─── -->
  <line x1="340" y1="24" x2="340" y2="556" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="4 4"/>


  <!-- ══════════════════════════════════════════
       RIGHT SIDE — JOIN FETCH fix
  ══════════════════════════════════════════ -->

  <!-- Column header (teal) -->
  <rect x="370" y="30" width="270" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th-t" x="505" y="48" text-anchor="middle" dominant-baseline="central">✓  JOIN FETCH — 1 query</text>

  <!-- Your code (gray) -->
  <rect x="420" y="104" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th-g" x="505" y="120" text-anchor="middle" dominant-baseline="central">Your code</text>
  <text class="ts-g" x="505" y="138" text-anchor="middle" dominant-baseline="central">findAllOrders()</text>

  <!-- Arrow -->
  <line x1="505" y1="148" x2="505" y2="170" class="arr" marker-end="url(#arrow)"/>

  <!-- Single query (teal) -->
  <rect x="370" y="172" width="270" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th-t" x="505" y="192" text-anchor="middle" dominant-baseline="central">Query 1  (only query)</text>
  <text class="ts-t" x="505" y="212" text-anchor="middle" dominant-baseline="central">SELECT * FROM orders JOIN customer</text>

  <!-- Arrow -->
  <line x1="505" y1="228" x2="505" y2="252" class="arr" marker-end="url(#arrow)"/>

  <!-- All data in one result (teal) -->
  <rect x="390" y="254" width="230" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th-t" x="505" y="274" text-anchor="middle" dominant-baseline="central">All data in one result</text>
  <text class="ts-t" x="505" y="294" text-anchor="middle" dominant-baseline="central">orders + customers together</text>

  <!-- Arrow -->
  <line x1="505" y1="310" x2="505" y2="334" class="arr" marker-end="url(#arrow)"/>

  <!-- Total (teal) -->
  <rect x="390" y="336" width="230" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th-t" x="505" y="352" text-anchor="middle" dominant-baseline="central">Total: 1 query</text>
  <text class="ts-t" x="505" y="370" text-anchor="middle" dominant-baseline="central">3 orders → 1 DB round trip</text>

  <!-- Fix dashed callout -->
  <rect x="370" y="414" width="270" height="76" rx="8" fill="none" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="5 3"/>
  <text class="ts-t" x="505" y="436" text-anchor="middle" dominant-baseline="central" font-style="italic">join fetch o.customer</text>
  <text class="ts-g" x="505" y="456" text-anchor="middle" dominant-baseline="central">tells JPA to JOIN, not</text>
  <text class="ts-g" x="505" y="474" text-anchor="middle" dominant-baseline="central">fire separate queries</text>


  <!-- ─── BOTTOM LEGEND ─── -->
  <rect x="40" y="528" width="600" height="36" rx="8" fill="none" stroke="#D3D1C7" stroke-width="1"/>
  <text class="legend" x="340" y="552" text-anchor="middle" dominant-baseline="central">FetchType controls WHEN data loads  ·  join fetch controls HOW it loads</text>
</svg>
