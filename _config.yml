# The Site Configuration

theme: jekyll-theme-chirpy
baseurl: ""
lang: en
timezone: Asia/Kolkata

title: TalkTechie
tagline: Tech made simple — tutorials, tips & insights
description: >-
  TalkTechie is a tech blog covering Spring Boot, Kotlin,
  AI/ML concepts and practical tech tips for engineers.

url: "https://talktechie.com"

author:
  name: TalkTechie
  url: "https://talktechie.com"

# github:
#   username: talktechie

social:
  name: TalkTechie
  links:
    - https://github.com/talktechie

google_analytics:
  id: ""

favicon: /favicon.ico
theme_mode:
avatar: /assets/img/avatar.png
toc: true
paginate: 10

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - package*.json

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/